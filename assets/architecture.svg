<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Animated neural network architecture: 10 inputs, 16 hidden neurons, 8 hidden neurons, 1 sigmoid output">
  <title>ANN architecture 10 - 16 - 8 - 1</title>
  <style>
    .sans{font-family:'Trebuchet MS',Verdana,Arial,sans-serif}
    .mono{font-family:'Courier New','Lucida Console',monospace}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0230"/>
      <stop offset="1" stop-color="#1b0850"/>
    </linearGradient>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#ff3df2"/>
      <stop offset="1" stop-color="#faff3d"/>
      <animate attributeName="x1" values="0;1280" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="640;1920" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.25" stop-color="#ff3df2"/>
      <stop offset="0.5" stop-color="#faff3d"/>
      <stop offset="0.75" stop-color="#b4ff3d"/>
      <stop offset="1" stop-color="#00f0ff"/>
      <animate attributeName="x1" values="0;1280" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1280;2560" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3d0ff"/>
      <stop offset="0.5" stop-color="#8aa0ff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar01" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff3df2"/></linearGradient>
    <radialGradient id="gIn" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#7ffbff"/><stop offset="1" stop-color="#0088b0"/></radialGradient>
    <radialGradient id="gH1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#cdb4ff"/><stop offset="1" stop-color="#6a3fd0"/></radialGradient>
    <radialGradient id="gH2" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#e2ff9a"/><stop offset="1" stop-color="#5da800"/></radialGradient>
    <radialGradient id="gOut" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ffa6f8"/><stop offset="1" stop-color="#c0149f"/></radialGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.06"/></pattern>
    <clipPath id="win"><rect x="10" y="10" width="1260" height="700" rx="16"/></clipPath>
    <clipPath id="marq"><rect x="10" y="672" width="1260" height="24"/></clipPath>
    <path id="spark" d="M0 -14Q1.5 -1.5 14 0Q1.5 1.5 0 14Q-1.5 1.5 -14 0Q-1.5 -1.5 0 -14Z"/>
    <circle id="node" r="13"/>

    <!-- full connection meshes (every neuron to every neuron; hidden layer 1 draws 8 of its 16 neurons) -->
    <path id="m1" d="
      M270 205L570 202M270 205L570 246M270 205L570 290M270 205L570 334M270 205L570 418M270 205L570 462M270 205L570 506M270 205L570 550
      M270 243L570 202M270 243L570 246M270 243L570 290M270 243L570 334M270 243L570 418M270 243L570 462M270 243L570 506M270 243L570 550
      M270 281L570 202M270 281L570 246M270 281L570 290M270 281L570 334M270 281L570 418M270 281L570 462M270 281L570 506M270 281L570 550
      M270 319L570 202M270 319L570 246M270 319L570 290M270 319L570 334M270 319L570 418M270 319L570 462M270 319L570 506M270 319L570 550
      M270 357L570 202M270 357L570 246M270 357L570 290M270 357L570 334M270 357L570 418M270 357L570 462M270 357L570 506M270 357L570 550
      M270 395L570 202M270 395L570 246M270 395L570 290M270 395L570 334M270 395L570 418M270 395L570 462M270 395L570 506M270 395L570 550
      M270 433L570 202M270 433L570 246M270 433L570 290M270 433L570 334M270 433L570 418M270 433L570 462M270 433L570 506M270 433L570 550
      M270 471L570 202M270 471L570 246M270 471L570 290M270 471L570 334M270 471L570 418M270 471L570 462M270 471L570 506M270 471L570 550
      M270 509L570 202M270 509L570 246M270 509L570 290M270 509L570 334M270 509L570 418M270 509L570 462M270 509L570 506M270 509L570 550
      M270 547L570 202M270 547L570 246M270 547L570 290M270 547L570 334M270 547L570 418M270 547L570 462M270 547L570 506M270 547L570 550"/>
    <path id="m2" d="
      M570 202L870 194M570 202L870 246M570 202L870 298M570 202L870 350M570 202L870 402M570 202L870 454M570 202L870 506M570 202L870 558
      M570 246L870 194M570 246L870 246M570 246L870 298M570 246L870 350M570 246L870 402M570 246L870 454M570 246L870 506M570 246L870 558
      M570 290L870 194M570 290L870 246M570 290L870 298M570 290L870 350M570 290L870 402M570 290L870 454M570 290L870 506M570 290L870 558
      M570 334L870 194M570 334L870 246M570 334L870 298M570 334L870 350M570 334L870 402M570 334L870 454M570 334L870 506M570 334L870 558
      M570 418L870 194M570 418L870 246M570 418L870 298M570 418L870 350M570 418L870 402M570 418L870 454M570 418L870 506M570 418L870 558
      M570 462L870 194M570 462L870 246M570 462L870 298M570 462L870 350M570 462L870 402M570 462L870 454M570 462L870 506M570 462L870 558
      M570 506L870 194M570 506L870 246M570 506L870 298M570 506L870 350M570 506L870 402M570 506L870 454M570 506L870 506M570 506L870 558
      M570 550L870 194M570 550L870 246M570 550L870 298M570 550L870 350M570 550L870 402M570 550L870 454M570 550L870 506M570 550L870 558"/>
    <path id="m3" d="M870 194L1050 376M870 246L1050 376M870 298L1050 376M870 350L1050 376M870 402L1050 376M870 454L1050 376M870 506L1050 376M870 558L1050 376"/>
  </defs>

  <rect width="1280" height="720" fill="#05001a"/>

  <g clip-path="url(#win)">
    <rect x="10" y="10" width="1260" height="700" fill="url(#bg)"/>

    <!-- heading -->
    <text class="sans" x="640" y="92" font-size="32" font-weight="900" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)" textLength="620" lengthAdjust="spacingAndGlyphs">NEURAL NETWORK ARCHITECTURE</text>
    <text class="mono" x="640" y="115" font-size="14" text-anchor="middle" fill="#cbd5ff" textLength="520" lengthAdjust="spacing">binary classification · customer churn · fully connected</text>

    <!-- layer panels (flash as the forward-pass beam crosses them) -->
    <rect x="250" y="180" width="40" height="390" rx="20" fill="#00f0ff" opacity="0.18">
      <animate attributeName="opacity" values="0.18;0.18;0.6;0.18;0.18" keyTimes="0;0.06;0.09;0.19;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="550" y="180" width="40" height="390" rx="20" fill="#b48cff" opacity="0.18">
      <animate attributeName="opacity" values="0.18;0.18;0.6;0.18;0.18" keyTimes="0;0.375;0.405;0.505;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="850" y="170" width="40" height="400" rx="20" fill="#b4ff3d" opacity="0.18">
      <animate attributeName="opacity" values="0.18;0.18;0.6;0.18;0.18" keyTimes="0;0.69;0.72;0.82;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1026" y="338" width="48" height="76" rx="24" fill="#ff3df2" opacity="0.18">
      <animate attributeName="opacity" values="0.18;0.18;0.7;0.18;0.18" keyTimes="0;0.88;0.91;0.98;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- layer headers -->
    <g class="sans" font-weight="900" font-size="16" text-anchor="middle">
      <text x="270" y="148" fill="#00f0ff">INPUT</text>
      <text x="570" y="148" fill="#b48cff">HIDDEN 1</text>
      <text x="870" y="148" fill="#b4ff3d">HIDDEN 2</text>
      <text x="1050" y="148" fill="#ff3df2">OUTPUT</text>
    </g>
    <g class="mono" font-size="12" text-anchor="middle" fill="#cbd5ff">
      <text x="270" y="166">10 features</text>
      <text x="570" y="166">16 neurons (8 shown)</text>
      <text x="870" y="166">8 neurons</text>
      <text x="1050" y="166">1 neuron</text>
    </g>

    <!-- connections -->
    <g fill="none" stroke-linecap="round">
      <use xlink:href="#m1" stroke="#b9a7ff" stroke-opacity="0.22" stroke-width="1"/>
      <use xlink:href="#m2" stroke="#b9a7ff" stroke-opacity="0.22" stroke-width="1"/>
      <use xlink:href="#m3" stroke="#b9a7ff" stroke-opacity="0.3" stroke-width="1"/>
      <!-- data pulses -->
      <use xlink:href="#m1" stroke="#00f0ff" stroke-opacity="0.9" stroke-width="1.6" stroke-dasharray="6 94">
        <animate attributeName="stroke-dashoffset" values="0;-100" dur="2s" repeatCount="indefinite"/>
      </use>
      <use xlink:href="#m2" stroke="#ff3df2" stroke-opacity="0.9" stroke-width="1.6" stroke-dasharray="6 94">
        <animate attributeName="stroke-dashoffset" values="0;-100" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </use>
      <use xlink:href="#m3" stroke="#faff3d" stroke-opacity="0.95" stroke-width="2" stroke-dasharray="8 92">
        <animate attributeName="stroke-dashoffset" values="0;-100" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- hidden layer 1 ellipsis -->
    <g fill="#ffffff">
      <circle cx="570" cy="360" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="570" cy="376" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.25s" repeatCount="indefinite"/></circle>
      <circle cx="570" cy="392" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- neurons -->
    <g fill="url(#gIn)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5">
      <use xlink:href="#node" x="270" y="205"/><use xlink:href="#node" x="270" y="243"/><use xlink:href="#node" x="270" y="281"/>
      <use xlink:href="#node" x="270" y="319"/><use xlink:href="#node" x="270" y="357"/><use xlink:href="#node" x="270" y="395"/>
      <use xlink:href="#node" x="270" y="433"/><use xlink:href="#node" x="270" y="471"/><use xlink:href="#node" x="270" y="509"/>
      <use xlink:href="#node" x="270" y="547"/>
    </g>
    <g fill="url(#gH1)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5">
      <use xlink:href="#node" x="570" y="202"/><use xlink:href="#node" x="570" y="246"/><use xlink:href="#node" x="570" y="290"/>
      <use xlink:href="#node" x="570" y="334"/><use xlink:href="#node" x="570" y="418"/><use xlink:href="#node" x="570" y="462"/>
      <use xlink:href="#node" x="570" y="506"/><use xlink:href="#node" x="570" y="550"/>
    </g>
    <g fill="url(#gH2)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5">
      <use xlink:href="#node" x="870" y="194"/><use xlink:href="#node" x="870" y="246"/><use xlink:href="#node" x="870" y="298"/>
      <use xlink:href="#node" x="870" y="350"/><use xlink:href="#node" x="870" y="402"/><use xlink:href="#node" x="870" y="454"/>
      <use xlink:href="#node" x="870" y="506"/><use xlink:href="#node" x="870" y="558"/>
    </g>
    <circle cx="1050" cy="376" r="17" fill="none" stroke="#ff3df2" stroke-width="2">
      <animate attributeName="r" values="17;30" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="376" r="17" fill="url(#gOut)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>

    <!-- input feature names (from the dataset) -->
    <g class="mono" font-size="14" fill="#d9e8ff" text-anchor="end">
      <text x="246" y="210">age</text>
      <text x="246" y="248">tenure_months</text>
      <text x="246" y="286">monthly_charges</text>
      <text x="246" y="324">support_tickets</text>
      <text x="246" y="362">late_payments</text>
      <text x="246" y="400">usage_hours</text>
      <text x="246" y="438">satisfaction</text>
      <text x="246" y="476">contract_monthly</text>
      <text x="246" y="514">tech_support</text>
      <text x="246" y="552">auto_payment</text>
    </g>

    <!-- output arrow + probability meter -->
    <path d="M1070 376H1108" stroke="#ff3df2" stroke-width="3" stroke-dasharray="6 4" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <polygon points="1108,369 1120,376 1108,383" fill="#ff3df2"/>
    <rect x="1122" y="322" width="140" height="108" rx="12" fill="#0a0230" fill-opacity="0.85" stroke="#ff3df2" stroke-width="2"/>
    <text class="sans" x="1192" y="354" font-size="26" font-weight="900" text-anchor="middle" fill="#ffffff">ŷ</text>
    <text class="mono" x="1192" y="374" font-size="13" text-anchor="middle" fill="#ffd1fb">P(churn = 1)</text>
    <rect x="1137" y="388" width="110" height="8" rx="4" fill="url(#bar01)" stroke="#ffffff" stroke-opacity="0.5"/>
    <circle cy="392" r="6" fill="#ffffff" stroke="#ff3df2" stroke-width="2">
      <animate attributeName="cx" values="1142;1242;1142" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="1192" y="420" font-size="11" text-anchor="middle" fill="#cbd5ff">value in (0, 1)</text>

    <!-- bottom info boxes -->
    <g class="mono" text-anchor="middle">
      <rect x="185" y="588" width="170" height="52" rx="10" fill="#0a0230" fill-opacity="0.85" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="270" y="609" font-size="12" font-weight="bold" fill="#00f0ff">StandardScaler</text>
      <text x="270" y="627" font-size="12" fill="#cbd5ff">tensor (N, 10)</text>

      <rect x="485" y="588" width="170" height="52" rx="10" fill="#0a0230" fill-opacity="0.85" stroke="#b48cff" stroke-width="1.5"/>
      <text x="570" y="609" font-size="12" font-weight="bold" fill="#b48cff">Linear(10→16) + ReLU</text>
      <text x="570" y="627" font-size="12" fill="#cbd5ff">176 params</text>

      <rect x="785" y="588" width="170" height="52" rx="10" fill="#0a0230" fill-opacity="0.85" stroke="#b4ff3d" stroke-width="1.5"/>
      <text x="870" y="609" font-size="12" font-weight="bold" fill="#b4ff3d">Linear(16→8) + ReLU</text>
      <text x="870" y="627" font-size="12" fill="#cbd5ff">136 params</text>

      <rect x="965" y="588" width="170" height="52" rx="10" fill="#0a0230" fill-opacity="0.85" stroke="#ff3df2" stroke-width="1.5"/>
      <text x="1050" y="609" font-size="12" font-weight="bold" fill="#ff3df2">Linear(8→1) + Sigmoid</text>
      <text x="1050" y="627" font-size="12" fill="#cbd5ff">9 params</text>
    </g>
    <g class="mono" font-size="12" text-anchor="middle" fill="#8aa0ff">
      <text x="570" y="658">out (N, 16)</text>
      <text x="870" y="658">out (N, 8)</text>
      <text x="1050" y="658">out (N, 1)</text>
    </g>

    <!-- forward-pass beam -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="150 0;1100 0" dur="5s" repeatCount="indefinite"/>
      <rect x="0" y="175" width="70" height="395" fill="url(#beamG)"/>
    </g>

    <!-- marquee -->
    <rect x="10" y="672" width="1260" height="24" fill="#05001a" fill-opacity="0.75"/>
    <path d="M10 672H1270M10 696H1270" stroke="#00f0ff" stroke-opacity="0.7"/>
    <g clip-path="url(#marq)">
      <g class="mono" font-size="14" font-weight="bold" fill="#00f0ff">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="28s" repeatCount="indefinite"/>
        <text x="0" y="689" textLength="1400" lengthAdjust="spacing">FORWARD PASS // PREDICTION // BCE LOSS // BACKPROP // GRADIENTS // ADAM UPDATE // REPEAT FOR 100 EPOCHS // ReLU + SIGMOID // 321 TRAINABLE PARAMETERS //</text>
        <text x="1400" y="689" textLength="1400" lengthAdjust="spacing">FORWARD PASS // PREDICTION // BCE LOSS // BACKPROP // GRADIENTS // ADAM UPDATE // REPEAT FOR 100 EPOCHS // ReLU + SIGMOID // 321 TRAINABLE PARAMETERS //</text>
      </g>
    </g>

    <!-- sparkles -->
    <g transform="translate(80 100)"><use xlink:href="#spark" fill="#ffffff"><animateTransform attributeName="transform" type="scale" values="0.3;1.2;0.3" dur="2.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(1200 110)"><use xlink:href="#spark" fill="#faff3d"><animateTransform attributeName="transform" type="scale" values="0.3;1.2;0.3" dur="3s" repeatCount="indefinite"/></use></g>
    <g transform="translate(90 620)"><use xlink:href="#spark" fill="#ff3df2"><animateTransform attributeName="transform" type="scale" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></use></g>
    <g transform="translate(1210 600)"><use xlink:href="#spark" fill="#00f0ff"><animateTransform attributeName="transform" type="scale" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(420 140)"><use xlink:href="#spark" fill="#b4ff3d"><animateTransform attributeName="transform" type="scale" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></use></g>

    <rect x="10" y="10" width="1260" height="700" fill="url(#scan)"/>

    <!-- titlebar -->
    <rect x="10" y="10" width="1260" height="40" fill="url(#chrome)"/>
    <path d="M10 50H1270" stroke="#5a6bd6" stroke-width="2"/>
    <circle cx="34" cy="30" r="6" fill="#b4ff3d" stroke="#0a0230" stroke-width="1.5"/>
    <text class="mono" x="50" y="35" font-size="15" font-weight="bold" fill="#0a0230">C:\CHURN\forward_pass.exe  //  10 → 16 → 8 → 1</text>
    <rect x="1170" y="20" width="24" height="20" rx="4" fill="url(#chrome)" stroke="#0a0230" stroke-width="1.5"/>
    <path d="M1176 36H1188" stroke="#0a0230" stroke-width="2"/>
    <rect x="1200" y="20" width="24" height="20" rx="4" fill="url(#chrome)" stroke="#0a0230" stroke-width="1.5"/>
    <rect x="1207" y="25" width="10" height="10" fill="none" stroke="#0a0230" stroke-width="2"/>
    <rect x="1230" y="20" width="24" height="20" rx="4" fill="#ff3df2" stroke="#0a0230" stroke-width="1.5"/>
    <path d="M1237 25l10 10M1247 25l-10 10" stroke="#0a0230" stroke-width="2"/>
  </g>

  <rect x="10" y="10" width="1260" height="700" rx="16" fill="none" stroke="url(#rainbow)" stroke-width="3"/>
</svg>