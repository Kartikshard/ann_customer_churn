<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Animated bar chart of BCE loss: training start about 0.69, training end about 0.39, test about 0.389">
  <title>BCE loss: training start, training end, test</title>
  <style>
    .sans{font-family:'Trebuchet MS',Verdana,Arial,sans-serif}
    .mono{font-family:'Courier New','Lucida Console',monospace}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0230"/>
      <stop offset="1" stop-color="#1b0850"/>
    </linearGradient>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#ff3df2"/>
      <stop offset="1" stop-color="#faff3d"/>
      <animate attributeName="x1" values="0;1000" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="500;1500" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.25" stop-color="#ff3df2"/>
      <stop offset="0.5" stop-color="#faff3d"/>
      <stop offset="0.75" stop-color="#b4ff3d"/>
      <stop offset="1" stop-color="#00f0ff"/>
      <animate attributeName="x1" values="0;1000" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1000;2000" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3d0ff"/>
      <stop offset="0.5" stop-color="#8aa0ff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8fdff"/><stop offset="0.35" stop-color="#00f0ff"/><stop offset="1" stop-color="#0088b0"/></linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc2fa"/><stop offset="0.35" stop-color="#ff3df2"/><stop offset="1" stop-color="#a0128f"/></linearGradient>
    <linearGradient id="gYel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbffb0"/><stop offset="0.35" stop-color="#faff3d"/><stop offset="1" stop-color="#9fa400"/></linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.06"/></pattern>
    <clipPath id="win"><rect x="10" y="10" width="980" height="520" rx="14"/></clipPath>
    <path id="spark" d="M0 -14Q1.5 -1.5 14 0Q1.5 1.5 0 14Q-1.5 1.5 -14 0Q-1.5 -1.5 0 -14Z"/>
  </defs>

  <rect width="1000" height="540" fill="#05001a"/>

  <g clip-path="url(#win)">
    <rect x="10" y="10" width="980" height="520" fill="url(#bg)"/>

    <!-- heading -->
    <text class="sans" x="500" y="94" font-size="32" font-weight="900" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)" textLength="360" lengthAdjust="spacingAndGlyphs">LOSS REPORT</text>
    <text class="mono" x="500" y="118" font-size="14" text-anchor="middle" fill="#cbd5ff" textLength="380" lengthAdjust="spacing">Binary cross-entropy · 100 epochs · 10 → 16 → 8 → 1</text>

    <!-- grid -->
    <g stroke="#8aa0ff" stroke-opacity="0.25" stroke-width="1">
      <path d="M120 170H940M120 240H940M120 310H940M120 380H940"/>
    </g>
    <path d="M120 450H940" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M120 160V450" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <g class="mono" font-size="13" fill="#cbd5ff" text-anchor="end">
      <text x="110" y="455">0.0</text>
      <text x="110" y="385">0.2</text>
      <text x="110" y="315">0.4</text>
      <text x="110" y="245">0.6</text>
      <text x="110" y="175">0.8</text>
    </g>
    <text class="mono" transform="rotate(-90 52 310)" x="52" y="310" font-size="14" font-weight="bold" text-anchor="middle" fill="#00f0ff">BCE LOSS</text>

    <!-- ln 2 reference -->
    <path d="M120 207.5H940" stroke="#faff3d" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <text class="mono" x="940" y="198" font-size="12" text-anchor="end" fill="#faff3d">ln 2 = 0.693 : loss when always predicting 0.5</text>

    <!-- bar 1: train start ~0.69 -->
    <rect x="190" y="450" width="150" height="0" rx="4" fill="url(#gCyan)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2">
      <animate attributeName="height" values="0;0;241.5;241.5;0" keyTimes="0;0.05;0.2;0.92;1" calcMode="spline" keySplines="0 0 1 1;.2 .9 .3 1;0 0 1 1;.6 0 .9 .4" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="450;450;208.5;208.5;450" keyTimes="0;0.05;0.2;0.92;1" calcMode="spline" keySplines="0 0 1 1;.2 .9 .3 1;0 0 1 1;.6 0 .9 .4" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text class="sans" x="265" y="194" font-size="26" font-weight="900" text-anchor="middle" fill="#00f0ff" filter="url(#glow)" opacity="0">≈ 0.69
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.22;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- bar 2: train end ~0.39 -->
    <rect x="430" y="450" width="150" height="0" rx="4" fill="url(#gPink)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2">
      <animate attributeName="height" values="0;0;136.5;136.5;0" keyTimes="0;0.2;0.35;0.92;1" calcMode="spline" keySplines="0 0 1 1;.2 .9 .3 1;0 0 1 1;.6 0 .9 .4" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="450;450;313.5;313.5;450" keyTimes="0;0.2;0.35;0.92;1" calcMode="spline" keySplines="0 0 1 1;.2 .9 .3 1;0 0 1 1;.6 0 .9 .4" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text class="sans" x="505" y="299" font-size="26" font-weight="900" text-anchor="middle" fill="#ff3df2" filter="url(#glow)" opacity="0">≈ 0.39
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.37;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- bar 3: test ~0.389 -->
    <rect x="670" y="450" width="150" height="0" rx="4" fill="url(#gYel)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2">
      <animate attributeName="height" values="0;0;136.15;136.15;0" keyTimes="0;0.35;0.5;0.92;1" calcMode="spline" keySplines="0 0 1 1;.2 .9 .3 1;0 0 1 1;.6 0 .9 .4" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="450;450;313.85;313.85;450" keyTimes="0;0.35;0.5;0.92;1" calcMode="spline" keySplines="0 0 1 1;.2 .9 .3 1;0 0 1 1;.6 0 .9 .4" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text class="sans" x="745" y="299" font-size="26" font-weight="900" text-anchor="middle" fill="#faff3d" filter="url(#glow)" opacity="0">≈ 0.389
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.52;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- drop arrow bar1 -> bar2 -->
    <path d="M352 224C395 224 410 268 424 302" pathLength="100" stroke="#ff3df2" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.3;0.42;0.92;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <polygon points="415,296 433,296 424,312" fill="#ff3df2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.43;0.92;1" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <text class="sans" x="385" y="345" font-size="18" font-weight="900" text-anchor="middle" fill="#ff3df2" opacity="0">≈ −0.30
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.46;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- train ≈ test -->
    <text class="sans" x="625" y="343" font-size="34" font-weight="900" text-anchor="middle" fill="#faff3d" opacity="0">≈
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text class="mono" x="625" y="362" font-size="12" text-anchor="middle" fill="#faff3d" opacity="0">train ≈ test
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- category labels -->
    <g class="mono" font-size="13" text-anchor="middle" fill="#e6ecff">
      <text x="265" y="474" font-weight="bold" fill="#00f0ff">TRAIN LOSS</text>
      <text x="265" y="492" fill="#cbd5ff">start of training</text>
      <text x="505" y="474" font-weight="bold" fill="#ff3df2">TRAIN LOSS</text>
      <text x="505" y="492" fill="#cbd5ff">after 100 epochs</text>
      <text x="745" y="474" font-weight="bold" fill="#faff3d">TEST LOSS</text>
      <text x="745" y="492" fill="#cbd5ff">after 100 epochs</text>
    </g>
    <text class="mono" x="500" y="518" font-size="11" text-anchor="middle" fill="#8aa0ff">bars show start / end values from my training notes · no per-epoch curve is plotted</text>

    <!-- sparkles -->
    <g transform="translate(900 100)"><use xlink:href="#spark" fill="#ffffff"><animateTransform attributeName="transform" type="scale" values="0.3;1.2;0.3" dur="2.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(100 110)"><use xlink:href="#spark" fill="#ff3df2"><animateTransform attributeName="transform" type="scale" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></use></g>
    <g transform="translate(950 480)"><use xlink:href="#spark" fill="#00f0ff"><animateTransform attributeName="transform" type="scale" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></use></g>

    <rect x="10" y="10" width="980" height="520" fill="url(#scan)"/>

    <!-- titlebar -->
    <rect x="10" y="10" width="980" height="36" fill="url(#chrome)"/>
    <path d="M10 46H990" stroke="#5a6bd6" stroke-width="2"/>
    <circle cx="32" cy="28" r="6" fill="#00f0ff" stroke="#0a0230" stroke-width="1.5"/>
    <text class="mono" x="48" y="33" font-size="15" font-weight="bold" fill="#0a0230">C:\CHURN\loss_report.exe</text>
    <rect x="900" y="18" width="24" height="20" rx="4" fill="url(#chrome)" stroke="#0a0230" stroke-width="1.5"/>
    <path d="M906 34H918" stroke="#0a0230" stroke-width="2"/>
    <rect x="930" y="18" width="24" height="20" rx="4" fill="url(#chrome)" stroke="#0a0230" stroke-width="1.5"/>
    <rect x="937" y="22" width="10" height="10" fill="none" stroke="#0a0230" stroke-width="2"/>
    <rect x="960" y="18" width="24" height="20" rx="4" fill="#ff3df2" stroke="#0a0230" stroke-width="1.5"/>
    <path d="M967 22l10 10M977 22l-10 10" stroke="#0a0230" stroke-width="2"/>
  </g>

  <rect x="10" y="10" width="980" height="520" rx="14" fill="none" stroke="url(#rainbow)" stroke-width="3"/>
</svg>