<svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
<style>
  text{font-family:'Fira Code',ui-monospace,Consolas,monospace}
  .fill{transform-box:fill-box;transform-origin:0 50%;animation:s 6s ease-out infinite}
  @keyframes s{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
  .res{animation:r 6s ease-out infinite}
  @keyframes r{0%,30%{opacity:0}45%,100%{opacity:1}}
  .mk{animation:m 1.8s ease-in-out infinite}
  @keyframes m{0%,100%{opacity:.5}50%{opacity:1}}
  .l{fill:#6b6b8a;font-size:11px;text-anchor:middle}
</style>
<defs>
  <linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#b4ff3d"/><stop offset=".5" stop-color="#faff3d"/><stop offset="1" stop-color="#ff3df2"/></linearGradient>
</defs>
<rect width="900" height="230" rx="16" fill="#0b0b1a" stroke="#1f1f3d"/>
<text x="450" y="34" fill="#00f0ff" font-size="16" font-weight="600" text-anchor="middle">New customer · churn probability vs threshold</text>

<rect x="60" y="100" width="780" height="26" rx="13" fill="#12122a" stroke="#1f1f3d"/>
<rect class="fill" x="60" y="100" width="715.5" height="26" rx="13" fill="url(#gr)"/>

<g class="mk"><line x1="294" y1="86" x2="294" y2="140" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3"/>
<text x="294" y="78" fill="#ffffff" font-size="12" text-anchor="middle">threshold 0.30</text></g>

<g class="res"><line x1="775.5" y1="94" x2="775.5" y2="132" stroke="#ff3df2" stroke-width="3"/>
<text x="775.5" y="150" fill="#ff3df2" font-size="12" text-anchor="middle">0.9173</text></g>

<g class="l"><text x="60" y="162" style="text-anchor:start">0.0</text><text x="450" y="162">0.5</text><text x="840" y="162" style="text-anchor:end">1.0</text></g>

<text class="res" x="450" y="205" fill="#e8e8ff" font-size="15" font-weight="600" text-anchor="middle">91.73% churn probability  →  0.9173 &gt; 0.30  →  <tspan fill="#ff3df2">CHURN</tspan></text>
</svg>