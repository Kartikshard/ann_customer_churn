<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 48" width="1200" height="48" role="img" aria-label="Animated section divider">
  <defs>
    <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#ff3df2"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff3df2"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="spark" d="M0 -10Q1 -1 10 0Q1 1 0 10Q-1 1 -10 0Q-1 -1 0 -10Z"/>
  </defs>

  <!-- base lines -->
  <path d="M40 24H548M1160 24H652" stroke="url(#ln)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- flowing dots -->
  <path d="M40 24H548" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 12" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M1160 24H652" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 12" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- travelling light -->
  <circle cy="24" r="4" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="40;548" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cy="24" r="4" fill="#faff3d" filter="url(#glow)">
    <animate attributeName="cx" values="1160;652" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- end caps -->
  <circle cx="40" cy="24" r="4" fill="#00f0ff"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1160" cy="24" r="4" fill="#00f0ff"><animate attributeName="r" values="3;6;3" dur="2s" begin="1s" repeatCount="indefinite"/></circle>

  <!-- side sparkles -->
  <g transform="translate(200 24)"><use xlink:href="#spark" fill="#faff3d"><animateTransform attributeName="transform" type="scale" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></use></g>
  <g transform="translate(1000 24)"><use xlink:href="#spark" fill="#b4ff3d"><animateTransform attributeName="transform" type="scale" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></use></g>
  <g transform="translate(420 24)"><use xlink:href="#spark" fill="#ffffff"><animateTransform attributeName="transform" type="scale" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></use></g>
  <g transform="translate(780 24)"><use xlink:href="#spark" fill="#ffffff"><animateTransform attributeName="transform" type="scale" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/></use></g>

  <!-- centre ornament -->
  <g transform="translate(600 24)">
    <circle r="8" fill="none" stroke="#ff3df2" stroke-width="2">
      <animate attributeName="r" values="8;26" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="none" stroke="#00f0ff" stroke-width="2">
      <animate attributeName="r" values="8;26" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="-16" y="-16" width="32" height="32" fill="none" stroke="#faff3d" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="-9" y="-9" width="18" height="18" fill="url(#gem)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>